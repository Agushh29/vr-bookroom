<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sala de Libros VR</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0c0500;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}

    /* Pantalla de carga A-Frame — fondo oscuro, sin el celeste default */
    .a-loader-title { display: none !important; }
    .a-orientation-modal { background: #0c0500 !important; }
    #a-canvas { background: #0c0500 !important; }

    /* Loading screen overlay */
    .a-loader {
      background: #0c0500 !important;
    }
    [data-aframe-inspector] {
      background: #0c0500 !important;
    }

    /* El div que A-Frame inyecta como loader */
    a-scene canvas {
      background: #0c0500 !important;
    }
    a-scene{position:fixed!important;inset:0!important;z-index:0!important}

    /* ── OVERLAY ── */
    #ov{
      position:fixed;inset:0;z-index:999;
      background:linear-gradient(180deg,#0c0500 0%,#180a03 25%,#1e0e05 65%,#0e0400 100%);
      display:flex;align-items:center;justify-content:center;padding:20px;
      transition:opacity .5s ease;
      overflow:hidden;
    }
    #ov.fade{opacity:0;pointer-events:none}
    #ov.off{display:none}

    #ov::before{
      content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);
      width:110%;height:55%;pointer-events:none;
      background:radial-gradient(ellipse at 50% -10%,rgba(255,160,40,.22) 0%,rgba(180,90,15,.07) 50%,transparent 72%);
    }

    /* ── ESTANTES CSS ── */
    .shelf{position:absolute;left:0;right:0;height:17%;overflow:hidden;pointer-events:none;}
    .shelf::before{
      content:'';position:absolute;top:0;left:0;right:0;bottom:10px;
      background:repeating-linear-gradient(90deg,
        #6b2c1a 0,#6b2c1a 15px, #1a0800 15px,#1a0800 16px,
        #2c4a1e 16px,#2c4a1e 29px, #0a1506 29px,#0a1506 30px,
        #1e3352 30px,#1e3352 43px, #060f1a 43px,#060f1a 44px,
        #7a4a10 44px,#7a4a10 57px, #1e1005 57px,#1e1005 58px,
        #4a1e2a 58px,#4a1e2a 71px, #130508 71px,#130508 72px,
        #1e4a3a 72px,#1e4a3a 85px, #061510 85px,#061510 86px,
        #5c3a0a 86px,#5c3a0a 99px, #160d02 99px,#160d02 100px,
        #3a2a5c 100px,#3a2a5c 113px,#0d0818 113px,#0d0818 114px,
        #6b3a1a 114px,#6b3a1a 127px,#1a0e04 127px,#1a0e04 128px,
        #2a4a2a 128px,#2a4a2a 141px,#081408 141px,#081408 142px
      );
    }
    .shelf::after{content:'';position:absolute;bottom:0;left:0;right:0;height:10px;background:linear-gradient(#3c1c07,#1c0b02);box-shadow:0 4px 14px rgba(0,0,0,.85);}
    .s1{top:3%}  .s1::before{background-position:0 0}
    .s2{top:22%} .s2::before{background-position:-48px 0}
    .s3{top:41%} .s3::before{background-position:-96px 0}
    .s4{top:60%} .s4::before{background-position:-24px 0}
    .s5{top:78%;height:22%} .s5::before{background-position:-72px 0}

    .wall{position:absolute;top:0;height:85%;width:46%;overflow:hidden;pointer-events:none;}
    .wl{left:0;background:linear-gradient(to right,#100600 0%,#1c0c04 55%,transparent 100%);transform:perspective(650px) rotateY(32deg);transform-origin:left center;}
    .wr{right:0;background:linear-gradient(to left,#100600 0%,#1c0c04 55%,transparent 100%);transform:perspective(650px) rotateY(-32deg);transform-origin:right center;}
    .vign{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,transparent 18%,rgba(0,0,0,.88) 100%);pointer-events:none;}

    /* ── PANEL GLASSMORPHISM ── */
    .panel{
      position:relative;z-index:1;
      max-width:620px;width:100%;
      background:rgba(8,5,18,.82);
      border:1px solid rgba(124,77,255,.28);
      border-radius:22px;
      padding:40px 44px 36px;
      display:flex;flex-direction:column;align-items:center;gap:24px;
      box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 8px 60px rgba(0,0,0,.8),0 0 80px rgba(80,40,180,.18);
    }
    @media(max-width:560px){.panel{padding:28px 18px 24px}}

    .eyebrow{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#c8a060;margin-bottom:8px}
    h1{font-size:clamp(24px,5vw,40px);font-weight:700;color:#f5efe0;text-align:center;line-height:1.2}
    .sub{font-size:15px;color:rgba(220,205,175,.55);text-align:center;margin-top:8px}

    .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:100%}
    @media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}

    .gc{
      cursor:pointer;padding:18px 10px;border-radius:12px;
      border:1.5px solid rgba(200,160,80,.15);background:rgba(200,160,80,.05);
      text-align:center;transition:all .18s;user-select:none;
    }
    .gc:hover{border-color:rgba(200,160,80,.5);background:rgba(200,160,80,.1);transform:translateY(-2px);box-shadow:0 0 18px rgba(200,140,40,.2)}
    .gc.sel{border-color:#c8a060;background:rgba(200,160,80,.15);box-shadow:0 0 24px rgba(200,140,40,.35)}
    .gc-i{font-size:28px;display:block;margin-bottom:7px}
    .gc-n{font-size:13px;font-weight:600;color:#e8d8b0}
    .gc.sel .gc-n{color:#f0c870}

    #go{
      margin-top:4px;padding:13px 42px;border-radius:50px;border:none;
      background:#8b5e1a;color:#f5ede0;font-size:15px;font-weight:700;
      cursor:pointer;transition:all .18s;
      box-shadow:0 4px 20px rgba(140,90,20,.4);
      opacity:.35;pointer-events:none;
    }
    #go.on{opacity:1;pointer-events:all}
    #go.on:hover{background:#a87020;transform:translateY(-2px);box-shadow:0 6px 28px rgba(160,110,20,.55)}

    /* TOAST */
    #toast{
      position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(60px);
      z-index:9999;background:rgba(0,200,100,.12);border:1.5px solid #00e676;color:#00e676;
      padding:11px 24px;border-radius:50px;font-size:14px;font-weight:700;
      transition:transform .3s cubic-bezier(.34,1.56,.64,1),opacity .3s;opacity:0;pointer-events:none;white-space:nowrap;
    }
    #toast.show{transform:translateX(-50%) translateY(0);opacity:1}

    /* PANEL 2D — card compacta estilo referencia */
    #book-card {
      display: none;
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 9000;
      width: min(460px, 88vw);
      background: #5c3520;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 40px rgba(0,0,0,0.8);
      flex-direction: column;
      font-family: system-ui, sans-serif;
    }
    #book-card.visible { display: flex; }

    /* Fila superior: portada + info */
    #card-top {
      display: flex; flex-direction: row;
    }
    #card-cover {
      width: 120px; min-width: 120px;
      background: #3d1e0a;
      position: relative;
    }
    #card-img {
      width: 120px; height: 100%;
      object-fit: cover; display: block;
      min-height: 160px;
    }
    #card-cover-fallback {
      position: absolute; inset: 0;
    }
    #card-info {
      padding: 18px 16px 14px;
      display: flex; flex-direction: column; gap: 6px;
      flex: 1; position: relative;
    }
    /* Corazón esquina sup der */
    #card-heart {
      position: absolute; top: 14px; right: 14px;
      width: 34px; height: 34px; border-radius: 50%;
      background: rgba(200,168,130,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; color: #c8a882; cursor: pointer;
      transition: all .2s;
      user-select: none;
    }
    #card-heart.saved { color: #e8866a; background: rgba(232,134,106,0.2); }
    #card-title {
      font-size: 18px; font-weight: 700;
      color: #fff; line-height: 1.2;
      padding-right: 40px;
    }
    #card-author {
      font-size: 12px; color: #c8a882; font-weight: 600;
    }
    #card-synop {
      font-size: 12px; color: #e8d8c4; line-height: 1.55;
      margin-top: 4px;
    }
    #card-price {
      font-size: 20px; font-weight: 700; color: #e8866a;
      margin-top: 6px;
    }
    /* Botones abajo */
    #card-btns {
      display: flex; gap: 10px;
      padding: 12px 16px 16px;
      border-top: 1px solid rgba(200,168,130,0.15);
      margin-top: 4px;
    }
    #card-btns button {
      flex: 1; padding: 10px 0; border-radius: 50px;
      font-size: 14px; font-weight: 600;
      cursor: pointer; font-family: inherit;
      transition: opacity .15s;
    }
    #card-btns button:hover { opacity: 0.85; }
    #btn-cerrar {
      background: transparent;
      border: 1.5px solid rgba(200,168,130,0.5);
      color: #c8a882;
    }
    #btn-comprar {
      background: #c8a882; color: #2a1408; border: none;
    }
    #card-dim {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 8999;
    }
    #card-dim.visible { display: block; }

    /* BOTÓN CAMBIAR GÉNERO — flotando en la escena VR */
    #btn-back-2d {
      display: none;
      position: fixed;
      /* Esquina superior izquierda, dentro del campo visual VR */
      top: 18%; left: 8%;
      z-index: 800;
      cursor: pointer;
      opacity: 0.88;
      transition: opacity .18s, transform .18s;
      height: 48px;
      width: auto;
      /* Sombra para dar sensación de profundidad */
      filter: drop-shadow(0 4px 16px rgba(0,0,0,0.55));
      transform: perspective(400px) rotateY(8deg);
    }
    #btn-back-2d:hover {
      opacity: 1;
      transform: perspective(400px) rotateY(8deg) scale(1.05);
      filter: drop-shadow(0 6px 22px rgba(0,0,0,0.7));
    }
    #btn-back-2d.visible { display: block; }

    /* TOOLTIP nombre libro — aparece sobre el libro en hover */
    #book-tooltip {
      display: none;
      position: fixed;
      z-index: 700;
      pointer-events: none;
      transform: translate(-50%, -100%);
      /* Globo estilo referencia: fondo rosado-beige, borde redondeado, cola abajo */
      background: #e8c4a8;
      color: #3d1e0a;
      font-size: 14px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 12px;
      white-space: nowrap;
      max-width: 200px;
      white-space: normal;
      text-align: center;
      line-height: 1.3;
      box-shadow: 0 4px 16px rgba(0,0,0,0.35);
    }
    /* Cola del globo apuntando hacia abajo */
    #book-tooltip::after {
      content: '';
      position: absolute;
      bottom: -10px; left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #e8c4a8;
      border-bottom: none;
    }
    #book-tooltip.visible { display: block; }

    /* HINT */
    #hint{
      position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:500;
      background:rgba(10,8,28,.85);border:1px solid rgba(255,255,255,.15);
      color:rgba(220,215,255,.6);padding:8px 18px;border-radius:50px;font-size:12px;
      opacity:0;pointer-events:none;transition:opacity .4s;
    }
    #hint.show{opacity:1}
  </style>
</head>
<body>

<div id="ov">
  <div class="wall wl">
    <div class="shelf s1"></div><div class="shelf s2"></div>
    <div class="shelf s3"></div><div class="shelf s4"></div><div class="shelf s5"></div>
  </div>
  <div class="wall wr">
    <div class="shelf s1"></div><div class="shelf s2"></div>
    <div class="shelf s3"></div><div class="shelf s4"></div><div class="shelf s5"></div>
  </div>
  <div class="vign"></div>
  <div class="panel">
    <div>
      <div class="eyebrow">📚 Biblioteca Virtual</div>
      <h1>¿Qué te gustaría<br>leer hoy?</h1>
      <p class="sub">Elegí un género para explorar la sala de libros en VR.</p>
    </div>

    <div class="grid">
      <div class="gc" data-g="fantasia"        onclick="pick(this)"><span class="gc-i">🧙</span><span class="gc-n">Fantasía</span></div>
      <div class="gc" data-g="romance"         onclick="pick(this)"><span class="gc-i">💞</span><span class="gc-n">Romance</span></div>
      <div class="gc" data-g="thriller"        onclick="pick(this)"><span class="gc-i">🔪</span><span class="gc-n">Thriller</span></div>
      <div class="gc" data-g="ciencia-ficcion" onclick="pick(this)"><span class="gc-i">🚀</span><span class="gc-n">Ciencia Ficción</span></div>
      <div class="gc" data-g="autoayuda"       onclick="pick(this)"><span class="gc-i">🌱</span><span class="gc-n">Autoayuda</span></div>
    </div>

    <button id="go" onclick="enterVR()">Entrar al showroom →</button>
  </div>
</div>

<div id="toast"></div>
<!-- PANEL 2D -->
<div id="card-dim" onclick="closePanel()"></div>
<div id="book-card">
  <div id="card-top">
    <div id="card-cover">
      <div id="card-cover-fallback"></div>
      <img id="card-img" src="" alt=""/>
    </div>
    <div id="card-info">
      <div id="card-heart" onclick="saveToFavorites()">♡</div>
      <div id="card-title"></div>
      <div id="card-author"></div>
      <div id="card-synop"></div>
      <div id="card-price"></div>
    </div>
  </div>
  <div id="card-btns">
    <button id="btn-cerrar" onclick="closePanel()">Cerrar</button>
    <button id="btn-comprar" onclick="kindle()">Comprar</button>
  </div>
</div>

    this.el.sceneEl.addEventListener('loaded', () => {

    const lc = this.el.components['look-controls'];

  }
});

     {u:'Marti.r',t:'hace 1 mes',    r:'Me ayudó a dejar de preocuparme por lo que no importa.'}],
    [{u:'Alber_P',t:'hace 1 día',    r:'Cambió completamente mi relación con el dinero.'},
     {u:'Guill T',t:'hace 4 días',   r:'Muy fácil de leer y lleno de consejos prácticos.'},
     {u:'Nestor.v',t:'hace 3 semanas',r:'El libro que desearía haber leído a los 20 años.'}],
  ]
};

const COLS=['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#1abc9c','#e67e22','#e91e63'];
const GNAMES={fantasia:'Fantasía',romance:'Romance',thriller:'Thriller','ciencia-ficcion':'Ciencia Ficción',autoayuda:'Autoayuda'};
let genre=null;
let currentOpenedBookIndex = null; // Track del libro abierto para evitar bugs visuales

function pick(el){
  document.querySelectorAll('.gc').forEach(c=>c.classList.remove('sel'));
  el.classList.add('sel');
  genre=el.dataset.g;
  document.getElementById('go').classList.add('on');
}

function enterVR(){
  if(!genre)return;

  loadBooks();

  const scene = document.getElementById('sc');
  scene.style.display = 'block';
  scene.style.visibility = 'visible';
  scene.style.opacity = '1';

  const ov=document.getElementById('ov');
  ov.classList.add('fade');
  setTimeout(()=>{ ov.classList.add('off'); }, 520);

  const h=document.getElementById('hint');
  h.classList.add('show');
  setTimeout(()=>h.classList.remove('show'),5000);

  setTimeout(()=>{
    window.dispatchEvent(new Event('resize'));
  }, 600);
}

function loadBooks(){
  DB[genre].forEach((b,i)=>{
    const el=document.getElementById('b'+i);
    if(!el)return;
    el.setAttribute('color',COLS[i]);
    el.setAttribute('emissive','#000');
    el.setAttribute('emissive-intensity','0');
    // Cargar portada de Open Library como textura
    const bk = DB[genre][i];
    if(bk && bk.isbn){
      const texImg = document.getElementById('btex-'+i);
      texImg.onload = () => {
        el.setAttribute('material', 'src:#btex-'+i+'; roughness:0.3');
      };
      texImg.onerror = () => { /* mantener color */ };
      texImg.src = 'https://covers.openlibrary.org/b/isbn/'+bk.isbn+'-M.jpg';
    }
    
    if(el._c) el.removeEventListener('click',el._c);
    el._c=()=>openPanel(i);
    el.addEventListener('click',el._c);

    if(!el._h){
      el._h=true;
      const op = el.getAttribute('position');
      el._ox = op.x; el._oy = op.y; el._oz = op.z;

      el.addEventListener('mouseenter',()=>{
        if(currentOpenedBookIndex !== null) return;
        el.setAttribute('emissive','#c8a060');
        el.setAttribute('emissive-intensity','0.45');
        const b = DB[genre][i];
        if(b) showTooltip(el, b.t);
      });
      el.addEventListener('mouseleave',()=>{
        if(currentOpenedBookIndex !== null) return;
        el.setAttribute('emissive','#000000');
        el.setAttribute('emissive-intensity','0');
        hideTooltip(el);
      });
    }
  });
  document.getElementById('glabel').setAttribute('value',GNAMES[genre]);
  document.getElementById('bback').setAttribute('visible','false');
  document.getElementById('btn-back-2d').classList.remove('visible'); // ocultar el 3D
  document.getElementById('btn-back-2d').classList.add('visible');
}

function openPanel(i){
  if(currentOpenedBookIndex !== null) return;
  currentOpenedBookIndex = i;

  const b  = DB[genre][i];
  const el = document.getElementById('b'+i);
  hideTooltip(el);

  // Libro: brilla
  el.setAttribute('emissive','#c8a060');
  el.setAttribute('emissive-intensity','0.4');

  // ── Textos card izquierda ──
  document.getElementById('ptitle').setAttribute('value', b.t);
  document.getElementById('pauthor').setAttribute('value', b.a + '  ·  ' + (b.y||''));
  document.getElementById('psynop').setAttribute('value', b.s);
  document.getElementById('pprice').setAttribute('value', b.p);
  document.getElementById('heart-icon').setAttribute('value','♡');

  // ── Portada central ──
  const coverEl = document.getElementById('pcover');
  coverEl.removeAttribute('material');
  coverEl.setAttribute('color', COLS[i]);
  if(b.isbn){
    const img = document.getElementById('cover-tex');
    img.onload  = ()=>{ coverEl.setAttribute('material','src:#cover-tex; fit:cover'); };
    img.onerror = ()=>{};
    img.src = 'https://covers.openlibrary.org/b/isbn/'+b.isbn+'-L.jpg?default=false';
  }

  // ── Reseñas ──
  const revs = (REVIEWS[genre]||[])[i] || [];
  ['rev1','rev2','rev3'].forEach((id,ri)=>{
    const rv = revs[ri] || {u:'',t:'',r:''};
    document.getElementById(id+'-user').setAttribute('value', rv.u ? rv.u+' · '+rv.t : '');
    document.getElementById(id+'-text').setAttribute('value', rv.r);
  });

  // ── Posicionar el display: en dirección del libro pero a 1.8m del centro ──
  const op  = el.getAttribute('position');
  const len = Math.sqrt(op.x*op.x + op.z*op.z) || 1;
  // Normalizar y poner a 1.8m del centro (más lejos que el libro que está a 1.1m)
  const cx  = (op.x/len * 1.8).toFixed(3);
  const cz  = (op.z/len * 1.8).toFixed(3);
  const cy  = '1.55';
  const ry  = (Math.atan2(op.x, op.z) * 180/Math.PI + 180).toFixed(1);

  const panel = document.getElementById('panel');
  panel.setAttribute('position', cx+' '+cy+' '+cz);
  panel.setAttribute('rotation', '0 '+ry+' 0');
  panel.setAttribute('scale','0.01 0.01 0.01');
  panel.setAttribute('visible','true');
  setTimeout(()=>{
    panel.setAttribute('animation__appear',
      'property:scale; from:0.01 0.01 0.01; to:0.82 0.82 0.82; dur:320; easing:easeOutBack');
  }, 150);
}

function closePanel(){
  // Cerrar panel 3D
  const panel = document.getElementById('panel');
  panel.setAttribute('animation__appear',
    'property:scale; to:0.01 0.01 0.01; dur:200; easing:easeInQuad');
  setTimeout(()=>{ panel.setAttribute('visible','false'); }, 220);

  if(currentOpenedBookIndex !== null){
    const el = document.getElementById('b'+currentOpenedBookIndex);
    if(el){
      el.setAttribute('emissive','#000000');
      el.setAttribute('emissive-intensity','0');
    }
  }
  currentOpenedBookIndex = null;
}

function kindle(){ toast('✓ ¡Agregado a tu Kindle!'); closePanel(); }
function saveToFavorites(){
  const h = document.getElementById('heart-icon');
  if(!h) return;
  const current = h.getAttribute('value');
  if(current === '♥'){
    h.setAttribute('value','♡');
    toast('Eliminado de favoritos');
  } else {
    h.setAttribute('value','♥');
    toast('♥ ¡Guardado en favoritos!');
  }
}

function goBack(){
  closePanel();
  document.getElementById('bback').setAttribute('visible','false');
  document.getElementById('btn-back-2d').classList.remove('visible');
  document.getElementById('glabel').setAttribute('value','');
  // Limpiar texturas de libros
  for(let i=0;i<8;i++){
    const el=document.getElementById('b'+i);
    if(el) el.removeAttribute('material');
  }
  const ov=document.getElementById('ov');
  ov.classList.remove('off');
  requestAnimationFrame(()=>requestAnimationFrame(()=>ov.classList.remove('fade')));
  document.querySelectorAll('.gc').forEach(c=>c.classList.remove('sel'));
  document.getElementById('go').classList.remove('on');
  genre=null;
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),3000);
}

/* ESTANTES DECORATIVOS */
const SC=['#6b2c1a','#2c4a1e','#1e3352','#7a4a10','#4a1e2a','#1e4a3a','#5c3a0a','#3a2a5c','#6b3a1a','#2a4a2a'];
function mkB(p,w,h,d,c,r){const e=document.createElement('a-box');e.setAttribute('position',p);e.setAttribute('width',w);e.setAttribute('height',h);e.setAttribute('depth',d);e.setAttribute('color',c);if(r)e.setAttribute('rotation',r);e.setAttribute('roughness','0.85');return e;}
function shUnit(parent,x,y,z,ry,uw,uh,rows,bpr){
  const w=document.createElement('a-entity');
  w.setAttribute('position',`${x} ${y} ${z}`);
  w.setAttribute('rotation',`0 ${ry} 0`);
  const f=document.createElement('a-box');
  f.setAttribute('width',uw+0.09);f.setAttribute('height',uh+0.12);f.setAttribute('depth','0.30');f.setAttribute('color','#180800');
  w.appendChild(f);
  const rh=uh/rows;
  for(let r=0;r<rows;r++){
    const sy=-uh/2+rh*r+rh*0.06;
    const sh=document.createElement('a-box');
    sh.setAttribute('position',`0 ${sy} 0`);sh.setAttribute('width',uw);sh.setAttribute('height','0.04');sh.setAttribute('depth','0.26');sh.setAttribute('color','#240d02');
    w.appendChild(sh);
    const bw=(uw-0.08)/bpr;
    for(let b=0;b<bpr;b++){
      const bx=-(uw-0.08)/2+bw*b+bw*0.5;
      const bh=rh*0.44+Math.random()*rh*0.20;
      const by=sy+0.02+bh/2;
      const col=SC[(r*bpr+b)%SC.length];
      const tilt=(Math.random()-.5)*5;
      w.appendChild(mkB(`${bx} ${by} 0`,bw*0.86,bh,0.18,col,`0 0 ${tilt}`));
    }
  }
  const top=document.createElement('a-box');
  top.setAttribute('position',`0 ${uh/2+0.035} 0`);top.setAttribute('width',uw+0.07);top.setAttribute('height','0.07');top.setAttribute('depth','0.32');top.setAttribute('color','#180800');
  w.appendChild(top);
  parent.appendChild(w);
}

// Convierte posición 3D del libro a coordenadas 2D de pantalla
function getScreenPos(el) {
  const obj   = el.object3D;
  const scene = document.getElementById('sc');
  const cam   = document.getElementById('cam');
  if(!obj || !scene || !cam) return null;
  const renderer = scene.renderer;
  const camera   = cam.getObject3D('camera');
  if(!renderer || !camera) return null;
  const pos = new THREE.Vector3();
  obj.getWorldPosition(pos);
  pos.project(camera);
  const w = renderer.domElement.clientWidth;
  const h = renderer.domElement.clientHeight;
  return {
    x: (pos.x * 0.5 + 0.5) * w,
    y: (-pos.y * 0.5 + 0.5) * h
  };
}

function showTooltip(el, title) {
  const tt = document.getElementById('book-tooltip');
  tt.textContent = title;
  tt.classList.add('visible');
  // Actualizar posición continuamente mientras está visible
  el._tooltipRAF = requestAnimationFrame(function loop(){
    if(!tt.classList.contains('visible')) return;
    const sp = getScreenPos(el);
    if(sp) {
      tt.style.left = sp.x + 'px';
      tt.style.top  = (sp.y - 12) + 'px'; // 12px sobre el libro
    }
    el._tooltipRAF = requestAnimationFrame(loop);
  });
}

function hideTooltip(el) {
  const tt = document.getElementById('book-tooltip');
  tt.classList.remove('visible');
  if(el._tooltipRAF) { cancelAnimationFrame(el._tooltipRAF); el._tooltipRAF = null; }
}

function initScene(){
  const s=document.getElementById('shelves');
  if(!s||s._done)return;
  s._done=true;
  shUnit(s,-4.5,2,-8.8,  0,2.6,3.8,4,10);
  shUnit(s,   0,2,-8.8,  0,2.6,3.8,4,10);
  shUnit(s, 4.5,2,-8.8,  0,2.6,3.8,4,10);
  shUnit(s,-8.8,2,  2.2, 90,2.6,3.8,4,10);
  shUnit(s,-8.8,2, -2.4, 90,2.6,3.8,4,10);
  shUnit(s,-8.8,2, -7.0, 90,2.6,3.8,4,10);
  shUnit(s, 8.8,2,  2.2,-90,2.6,3.8,4,10);
  shUnit(s, 8.8,2, -2.4,-90,2.6,3.8,4,10);
  shUnit(s, 8.8,2, -7.0,-90,2.6,3.8,4,10);

  // IMPORTANTE: Escuchar el click en los contenedores planos interactivos para evitar fallos de propagación
  // Botones del panel — escuchar en el a-plane hijo con class hit
  document.getElementById('pbk').addEventListener('click', kindle);
  document.getElementById('pcl').addEventListener('click', closePanel);
  document.getElementById('heart-btn').addEventListener('click', saveToFavorites);
  document.getElementById('bback-hit').addEventListener('click', goBack);
}

window.addEventListener('load',()=>{
  document.getElementById('sc').addEventListener('loaded', initScene);
  setTimeout(initScene, 1000);
});
</script>
